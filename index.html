<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIREPLAY — Configurar lista</title>
  <style>
    :root { --bg: #100711; --panel: #1b0f1d; --line: #352238; --accent: #ff003c; --text: #fff; --muted: #a09aad; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; }
    .logo { width: 160px; margin-bottom: 32px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px;
            width: 100%; max-width: 480px; }
    h1 { font-size: 1.25rem; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: .9rem; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
            color: var(--text); font-size: 1rem; padding: 12px 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { margin-top: 16px; width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px;
             font-size: 1rem; font-weight: 600; padding: 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: .9rem; display: none; }
    .msg.ok  { background: #0f3f1a; color: #4ade80; }
    .msg.err { background: #3f0f0f; color: #f87171; }
    .note { margin-top: 20px; color: var(--muted); font-size: .8rem; line-height: 1.5; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#ff9a38"/><stop offset=".5" stop-color="#ff003c"/><stop offset="1" stop-color="#ed004b"/>
      </linearGradient>
    </defs>
    <text x="0" y="46" font-family="Arial Black, sans-serif" font-weight="900" font-size="48" fill="url(#g)" letter-spacing="-1">FIREPLAY</text>
  </svg>

  <div class="card">
    <h1>Configurar lista de canais</h1>
    <p class="sub">Cole o endereço (URL) da sua lista M3U abaixo e clique em Enviar. A TV receberá a lista automaticamente.</p>

    <label for="urlInput">Endereço da lista M3U (começa com http:// ou https://)</label>
    <input id="urlInput" type="url" placeholder="https://..." autocomplete="off" spellcheck="false">
    <button id="btnEnviar" onclick="enviar()">Enviar para a TV</button>
    <div id="msg" class="msg"></div>

    <p class="note">
      Se a TV não receber a lista em 30 segundos, feche e abra novamente o QR code nas Configurações do FIREPLAY.
    </p>
  </div>

  <script>
    var token = (location.search.match(/[?&]token=([^&]+)/) || [])[1] || '';
    if (!token) {
      document.getElementById('msg').style.display = 'block';
      document.getElementById('msg').className = 'msg err';
      document.getElementById('msg').textContent = 'Token não encontrado. Escaneie o QR code novamente na TV.';
      document.getElementById('btnEnviar').disabled = true;
    }

    function enviar() {
      var url = document.getElementById('urlInput').value.trim();
      var btn = document.getElementById('btnEnviar');
      var msg = document.getElementById('msg');
      msg.style.display = 'none';

      if (!url || !/^https?:\/\//i.test(url)) {
        msg.className = 'msg err'; msg.style.display = 'block';
        msg.textContent = 'Insira uma URL válida (começando com https://).';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      var xhr = new XMLHttpRequest();
      xhr.open('PUT', 'https://jsonstore.io/' + token + '/url', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 400) {
          msg.className = 'msg ok'; msg.style.display = 'block';
          msg.textContent = '✓ Enviado! A TV vai receber a lista em alguns segundos. Pode fechar esta página.';
          btn.textContent = 'Enviado ✓';
        } else {
          onErro();
        }
      };
      xhr.onerror = onErro;
      xhr.send(JSON.stringify({ result: url }));

      function onErro() {
        btn.disabled = false;
        btn.textContent = 'Enviar para a TV';
        msg.className = 'msg err'; msg.style.display = 'block';
        msg.textContent = 'Falha no envio. Verifique a conexão e tente de novo.';
      }
    }

    document.getElementById('urlInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') enviar();
    });
  </script>
</body>
</html>
